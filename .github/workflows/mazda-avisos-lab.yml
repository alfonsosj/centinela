name: Compilar Mazda Avisos Lab APK
on:
  push:
    branches: [mazda-avisos-lab-build]
    paths:
      - 'mazda-avisos-lab/**'
      - '.github/workflows/mazda-avisos-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mazda-avisos-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazda-Avisos-Lab-APK
          path: mazda-avisos-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
